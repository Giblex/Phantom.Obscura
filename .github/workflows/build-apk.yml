name: Build Phantom Obscura APK

on:
  push:
    branches: [ main, master, "claude/*" ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  SUITE_DIR: Phantom Suite

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    # `run` steps operate inside the relocated checkout; steps that need the workspace
    # root (the shared Directory.Build.props) override this explicitly.
    defaults:
      run:
        working-directory: Phantom Suite/Phantom.Obscura

    steps:
      # The Android head ProjectReferences ..\..\..\Phantom.Root\Phantom.UI.Shared, which
      # resolves to a SIBLING of this repository. Checking out into "Phantom Suite/..."
      # reproduces the developer's on-disk layout so that reference resolves; a bare
      # checkout at the workspace root cannot restore this project at all.
      - name: Checkout Phantom.Obscura
        uses: actions/checkout@v4
        with:
          path: ${{ env.SUITE_DIR }}/Phantom.Obscura

      - name: Checkout Phantom.Shared (as Phantom.Root)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SHARED_REPO || 'Giblex-Pty-Ltd/Phantom.Shared' }}
          token: ${{ secrets.SUITE_REPO_TOKEN }}
          path: ${{ env.SUITE_DIR }}/Phantom.Root

      # Lives beside the projects rather than inside any one repository; keeps stale
      # obj_*/bin_* verification output out of the SDK's default compile globs.
      - name: Restore suite-level Directory.Build.props
        working-directory: ${{ github.workspace }}
        run: |
          cat > "$SUITE_DIR/Directory.Build.props" <<'PROPS'
          <Project>
            <PropertyGroup>
              <DefaultItemExcludes>$(DefaultItemExcludes);**/obj_*/**;**/bin_*/**</DefaultItemExcludes>
            </PropertyGroup>
          </Project>
          PROPS

      - name: Clear global.json SDK pin
        run: echo '{}' > global.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET SDK info
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses 2>/dev/null || true
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '%s\n' \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            84831b9409646a918e30573bab4c9c91346d8abd \
            > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"

      - name: Install Android SDK API 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore .NET workloads
        run: dotnet workload restore src/UI.Android.Avalonia/PhantomVault.UI.Android.csproj

      - name: Restore NuGet packages
        run: dotnet restore src/UI.Android.Avalonia/PhantomVault.UI.Android.csproj

      - name: Publish APK (debug-signed, sideloadable)
        run: |
          dotnet publish src/UI.Android.Avalonia/PhantomVault.UI.Android.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidKeyStore=false \
            -p:AndroidPackageFormat=apk \
            -p:AndroidCreatePackagePerAbi=false \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidUseSharedRuntime=false \
            -o ./artifacts/apk

      - name: Collect APK
        run: find ./artifacts -name "*.apk" | sort

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantom-obscura-apk
          path: |
            Phantom Suite/Phantom.Obscura/artifacts/apk/*.apk
            Phantom Suite/Phantom.Obscura/artifacts/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
