name: Security Hard-Rules

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hard-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject PHANTOM_DEV_BYPASS_POLICY outside a DEBUG-conditional block
        shell: bash
        run: |
          set -euo pipefail
          # The dev policy bypass must never survive into a Release build. Both
          # halves of that are legitimate: the bypass itself lives under
          # "#if DEBUG", and the refuse-to-start guard lives under "#if !DEBUG".
          # What is forbidden is an *unconditional* mention, which would compile
          # into Release. Requiring "#if !DEBUG" specifically (the previous rule)
          # rejected the correctly-guarded bypass in Program.cs.
          #
          # The old loop also piped into "while read", so its "exit 1" only left
          # a subshell and the step passed regardless. FAILED is checked at the end.
          FILES=$(grep -RIl --include='*.cs' 'PHANTOM_DEV_BYPASS_POLICY' src || true)
          FAILED=0
          for file in $FILES; do
            if ! awk '
              /^[[:space:]]*#if/ {
                stack[++top] = ($0 ~ /#if[[:space:]]+!?[[:space:]]*DEBUG[[:space:]]*$/) ? 1 : 0
                if (stack[top]) { dbg++ }
                next
              }
              /^[[:space:]]*#endif/ {
                if (top > 0) { if (stack[top]) { dbg-- } ; top-- }
                next
              }
              /PHANTOM_DEV_BYPASS_POLICY/ && dbg == 0 {
                printf "  line %d: %s\n", NR, $0
                bad = 1
              }
              END { exit bad }
            ' "$file"; then
              echo "::error file=$file::PHANTOM_DEV_BYPASS_POLICY appears outside a #if DEBUG / #if !DEBUG block"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ]

      - name: Reject System.Random in src
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --include='*.cs' -E '\bnew[[:space:]]+Random\(' src; then
            echo "::error::System.Random is forbidden — use RandomNumberGenerator"
            exit 1
          fi
          # Also reject Random.Shared (non-cryptographic, same risk as new Random()).
          # Only whole-line comments are exempt — "grep -v '// '" also let through
          # a real call that happened to carry a trailing comment.
          if grep -RIn --include='*.cs' 'Random\.Shared' src | grep -vE '^[^:]*:[0-9]+:[[:space:]]*(//|\*|/\*)'; then
            echo "::error::Random.Shared is forbidden in src — use RandomNumberGenerator"
            exit 1
          fi

      - name: Reject placeholder pin in committed config
        shell: bash
        run: |
          set -euo pipefail
          # Allow placeholder pin in *GatewayPolicy.cs (intentional sentinel).
          # Reject elsewhere.
          if grep -RIn --include='*.cs' --exclude='*GatewayPolicy.cs' 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' src; then
            echo "::error::Placeholder SPKI pin must only appear in *GatewayPolicy.cs"
            exit 1
          fi

      - name: Reject == / Equals on byte[] secret comparisons
        shell: bash
        run: |
          set -euo pipefail
          # Heuristic: byte[] variable name ending in Key/Hash/Tag/Mac compared with ==
          if grep -RInE --include='*.cs' '(Key|Hash|Tag|Mac|Secret|Pin)[[:space:]]*==[[:space:]]*' src \
             | grep -v 'FixedTimeEquals' \
             | grep -v '//.*==' ; then
            echo "::warning::Possible non-constant-time secret comparison — verify or use CryptographicOperations.FixedTimeEquals"
          fi

      - name: Reject "master password" required phrasing
        shell: bash
        run: |
          set -euo pipefail
          # Hard rule (user memory): keyfile mandatory, password optional.
          if grep -RIn --include='*.cs' --include='*.axaml' --include='*.md' \
             -E 'master password.*required|require[sd]?[[:space:]]+a?[[:space:]]*master password' src docs README.md SECURITY.md THREAT_MODEL.md 2>/dev/null; then
            echo "::error::Hard-rule violation — password is OPTIONAL, keyfile is MANDATORY"
            exit 1
          fi

      - name: Update-signing key gate (single source of truth)
        shell: bash
        run: |
          set -euo pipefail
          # The Ed25519 update-signing public key lives in exactly one file.
          # A duplicate would silently allow a forked-but-unsigned trust root.
          COUNT=$(find src -type f -name 'UpdatePublicKey.cs' | wc -l | tr -d ' ')
          if [ "$COUNT" != "1" ]; then
            echo "::error::Expected exactly one UpdatePublicKey.cs in src/, found $COUNT"
            find src -type f -name 'UpdatePublicKey.cs'
            exit 1
          fi

      - name: Update-signing provisioning gate not removed
        shell: bash
        run: |
          set -euo pipefail
          # UpdateVerifier MUST consult UpdatePublicKey.IsProvisioned before
          # attempting any Ed25519 verify; without that gate the all-zero
          # placeholder key would be silently accepted as a valid public key.
          if ! grep -RIn --include='UpdateVerifier.cs' 'UpdatePublicKey\.IsProvisioned' src >/dev/null; then
            echo "::error::UpdateVerifier.cs no longer references UpdatePublicKey.IsProvisioned — provisioning gate has been removed"
            exit 1
          fi
